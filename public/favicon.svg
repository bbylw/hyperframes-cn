<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#E2A63D" />
      <stop offset="100%" stop-color="#B3781A" />
    </linearGradient>
    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E2A63D" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="amb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2A63D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E2A63D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="64" height="64" rx="14" fill="#131110" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#181512" stroke="rgba(226,166,61,0.3)" stroke-width="2" />
  <circle cx="32" cy="32" r="20" fill="url(#amb-glow)" />

  <!-- Viewfinder Frame Corners -->
  <path d="M12 24V15a3 3 0 0 1 3-3h9" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M40 12h9a3 3 0 0 1 3 3v9" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M12 40v9a3 3 0 0 0 3 3h9" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M40 52h9a3 3 0 0 0 3-3v-9" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Reticle Micro Ticks -->
  <line x1="32" y1="12" x2="32" y2="16" stroke="#E2A63D" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="48" x2="32" y2="52" stroke="#E2A63D" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="32" x2="16" y2="32" stroke="#E2A63D" stroke-width="2" stroke-linecap="round" />
  <line x1="48" y1="32" x2="52" y2="32" stroke="#E2A63D" stroke-width="2" stroke-linecap="round" />

  <!-- Hyper Prism Core -->
  <path d="M25 22.5a2 2 0 0 1 2.9-1.74l15 8.66a2 2 0 0 1 0 3.48l-15 8.66A2 2 0 0 1 25 39.82V22.5z" fill="url(#gold-grad)" />
  <path d="M25 22.5L40 31.5L25 36V22.5Z" fill="url(#shine-grad)" />
</svg>
